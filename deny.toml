# cargo-deny configuration: run `cargo deny check` (CI runs it on every PR).
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Known security vulnerabilities and unmaintained crates fail the check.
ignore = []

[licenses]
# CNP's code is `MIT OR Apache-2.0` and must stay usable by closed-source programs, so every
# dependency has a permissive licence. No GPL, not even as an exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for future dependencies; don't warn about licences nothing uses yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version.
allow-wildcard-paths = true

[sources]
# Only crates.io.
unknown-registry = "deny"
unknown-git = "deny"
